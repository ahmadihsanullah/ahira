<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Undangan Annisa &amp; Faraz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== TOKEN DESAIN =====
   Layout: satu kolom ala aplikasi (maks 480px) di tengah layar; di desktop latar luar sedikit lebih gelap.
   Palet: krem off-white, charcoal, sage green. Tipografi: Playfair Display (judul) + Poppins (isi). */
:root{
  --bg:#FAF9F6; --outer:#FAF9F6; --surface:#FFFFFF;
  --ink:#2A2D2A; --ink-soft:#5B5F59;
  --sage:#8FA586; --sage-deep:#566D50; --sage-pale:#E8EDE3;
  --line:rgba(42,45,42,.12); --field:rgba(42,45,42,.28);
  --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --col:480px;
  color-scheme:light;
}
@media (min-width:520px){:root{--outer:#ECEAE3}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,figure,blockquote{margin:0}
button{font:inherit}
:focus-visible{outline:2px solid var(--sage-deep);outline-offset:3px}

.app{width:100%;max-width:var(--col);margin-inline:auto;background:var(--bg);min-height:100vh;position:relative;overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(42,45,42,.08)}}

/* ===== SEKSI UMUM ===== */
.sec{position:relative;text-align:center;padding-block:72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.sec--tint{background:var(--sage-pale)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--sage-deep);margin-bottom:12px}
.h2{font-family:var(--font-display);font-weight:500;font-size:clamp(30px,8.5vw,38px);line-height:1.2;margin-bottom:20px;text-wrap:balance}
.lead{color:var(--ink-soft);max-width:34ch;margin-inline:auto}
.lead + .lead{margin-top:16px}
.orn{display:block;width:150px;height:auto;margin:0 auto 20px;color:var(--sage)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid var(--sage-deep);background:var(--sage-deep);color:#FAF9F6;font-size:15px;font-weight:500;letter-spacing:.02em;line-height:1;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:#455A40}
.btn svg{width:18px;height:18px;flex:none}
.btn--ghost{background:transparent;color:var(--sage-deep)}
.btn--ghost:hover{background:var(--sage-pale)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ===== ANIMASI MASUK ===== */
.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.js .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .reveal{opacity:1;transform:none;transition:none}}

/* ===== 1. COVER ===== */
.cover{position:fixed;inset:0;z-index:100;display:flex;justify-content:center}
.cover.is-open{pointer-events:none}
.cover-in{position:relative;width:100%;max-width:var(--col);height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (prefers-reduced-motion:no-preference){.cover-in{transition:transform 1.1s cubic-bezier(.76,0,.24,1)}}
.cover.is-open .cover-in{transform:translateY(-104%)}
.cover-photo{position:absolute;inset:0;background:linear-gradient(165deg,#DDE5D6,#B9C9B0 55%,#9DB294);display:grid;place-items:start center;padding-top:22vh}
.cover-mono{font-family:var(--font-display);font-style:italic;font-size:clamp(84px,26vw,120px);line-height:1;color:#FAF9F6;opacity:.55}
.cover-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(250,249,246,0) 0,rgba(250,249,246,0) 30%,rgba(250,249,246,.9) 62%,var(--bg) 78%)}
.cover-orn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));width:min(46%,190px);height:auto;color:#FAF9F6;opacity:.92;pointer-events:none}
.cover-orn.l{left:-4px}
.cover-orn.r{right:-4px;transform:scaleX(-1)}
.cover-body{position:relative;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:24px;padding-bottom:max(34px,calc(env(safe-area-inset-bottom,0px) + 22px));padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.cover-eyebrow{font-family:var(--font-display);font-style:italic;font-size:19px;color:var(--sage-deep)}
.cover-names{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 .25em;font-family:var(--font-display);font-weight:500;font-size:clamp(38px,11.5vw,52px);line-height:1.15}
.cover-names .amp,.amp-sep{font-style:italic;color:var(--sage-deep)}
.cover-date{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.guest{margin:6px 0 8px;padding:12px 24px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.75);max-width:100%}
.guest-label{font-size:15px;color:var(--ink-soft)}
.guest-name{font-family:var(--font-display);font-size:22px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
@media (max-height:700px){.cover-body{gap:6px;padding-top:12px}.cover-names{font-size:clamp(34px,10vw,44px)}.guest{margin:2px 0 4px;padding:8px 20px}}

/* ===== 2. SALAM + AYAT ===== */
.verse{max-width:34ch;margin:34px auto;padding:26px 6px;border-block:1px solid var(--line)}
.verse blockquote{font-family:var(--font-display);font-style:italic;font-size:19px;line-height:1.75}
.verse figcaption{margin-top:14px;font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--sage-deep)}

/* ===== 3. MEMPELAI ===== */
.persons{display:grid;gap:14px;margin-top:36px}
.amp-sep{font-family:var(--font-display);font-size:34px;line-height:1}
.arch{width:min(240px,72%);aspect-ratio:3/4;margin:0 auto 28px;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--sage-pale);box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--sage)}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.person-nick{font-family:var(--font-display);font-style:italic;font-size:19px;color:var(--sage-deep)}
.person-name{font-family:var(--font-display);font-weight:500;font-size:27px;line-height:1.25;margin:2px 0 14px;text-wrap:balance}
.person-rel{color:var(--ink-soft)}
.person-parents{font-weight:500;overflow-wrap:anywhere}

/* ===== 4. COUNTDOWN ===== */
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:30px}
.cd-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 4px 12px}
.cd-num{display:block;font-family:var(--font-display);font-size:clamp(28px,8.5vw,36px);line-height:1.1;font-variant-numeric:tabular-nums}
.cd-lab{display:block;margin-top:6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.cd-done{margin-top:26px;font-family:var(--font-display);font-style:italic;font-size:20px}

/* ===== 5. ACARA ===== */
.events{display:grid;gap:14px;margin-top:34px}
.event-title{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:1.2;margin-bottom:12px}
.event-date{color:var(--ink-soft)}
.event-time{font-size:18px;font-weight:500;color:var(--sage-deep);margin:2px 0 18px;font-variant-numeric:tabular-nums}
.event-venue{font-weight:600;padding-top:18px;border-top:1px solid var(--line)}
.event-addr{color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere}

/* ===== 6. LOVE STORY ===== */
.timeline{position:relative;max-width:360px;margin:38px auto 0;padding-left:36px;text-align:left}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--sage)}
.moment{position:relative;padding-bottom:34px}
.moment:last-child{padding-bottom:0}
.moment::before{content:"";position:absolute;left:-36px;top:7px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--sage-deep);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 8px var(--sage-deep)}
.moment-when{font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-deep)}
.moment-title{font-family:var(--font-display);font-weight:500;font-size:23px;line-height:1.3;margin:2px 0 6px}
.moment-text{color:var(--ink-soft)}

/* ===== 7. GALERI + LIGHTBOX ===== */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:32px}
.shot{position:relative;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--sage-pale);aspect-ratio:4/5;cursor:zoom-in}
.shot:first-child{grid-column:1/-1;aspect-ratio:16/10}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:no-preference){.shot img{transition:transform .7s}.shot:hover img{transform:scale(1.04)}}
.lb{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(20,24,20,.93);padding:64px 16px}
.lb-img{max-width:min(100%,900px);max-height:100%;border-radius:10px;object-fit:contain}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid rgba(250,249,246,.35);background:rgba(250,249,246,.12);color:#FAF9F6;display:grid;place-items:center;cursor:pointer}
.lb-btn:hover{background:rgba(250,249,246,.25)}
.lb-btn svg{width:20px;height:20px}
.lb-close{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.lb-prev,.lb-next{top:50%;margin-top:-23px}
.lb-prev{left:max(10px,env(safe-area-inset-left,0px))}
.lb-next{right:max(10px,env(safe-area-inset-right,0px))}
.lb-count{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#FAF9F6;font-size:15px;font-variant-numeric:tabular-nums}

/* ===== 8. AMPLOP DIGITAL ===== */
.gifts{display:grid;gap:14px;margin-top:32px}
.acct-type{font-size:13px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--sage-deep)}
.acct-num{font-size:24px;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin:6px 0 2px;user-select:all;overflow-wrap:anywhere}
.acct-holder{color:var(--ink-soft);margin-bottom:20px;overflow-wrap:anywhere}
.acct-addr{color:var(--ink-soft);margin:6px 0 20px;overflow-wrap:anywhere}

/* ===== 9. RSVP + UCAPAN ===== */
.form{display:grid;gap:18px;margin-top:30px;text-align:left}
.field{display:grid;gap:8px;min-width:0;border:0;padding:0;margin:0}
.field > label,.field > legend{font-size:15px;font-weight:500;padding:0}
.input{width:100%;min-height:50px;padding:12px 16px;border:1px solid var(--field);border-radius:14px;background:#fff;color:var(--ink);font:400 16px/1.5 var(--font-body)}
textarea.input{min-height:120px;resize:vertical}
.input:focus{outline:2px solid var(--sage-deep);outline-offset:1px;border-color:var(--sage-deep)}
.input:disabled{opacity:.5}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg-item{position:relative}
.seg-item input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg-item label{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px solid var(--field);border-radius:14px;background:#fff;font-size:15px;font-weight:500;color:var(--ink-soft);text-align:center}
.seg-item input:checked + label{background:var(--sage-deep);border-color:var(--sage-deep);color:#FAF9F6}
.seg-item input:focus-visible + label{outline:2px solid var(--sage-deep);outline-offset:3px}
.form .btn{width:100%}
.wishes-h{font-family:var(--font-display);font-weight:500;font-size:26px;margin:48px 0 6px}
.wishes-note{font-size:15px;color:var(--ink-soft)}
.wishes{list-style:none;margin:20px 0 0;padding:0 4px 0 0;max-height:440px;overflow-y:auto;text-align:left}
.wish{padding:16px 0;border-bottom:1px solid var(--line)}
.wish:first-child{padding-top:0}
.wish-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.wish-name{font-weight:600;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--sage-pale);color:var(--sage-deep);font-size:14px;font-weight:500}
.pill--no{background:#EFEDE7;color:var(--ink-soft)}
.pill--tag{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.wish-msg{margin-top:6px;color:var(--ink-soft);overflow-wrap:anywhere;white-space:pre-line}
.wish-time{display:block;margin-top:4px;font-size:14px;color:var(--ink-soft)}

/* ===== 10. PENUTUP + FOOTER ===== */
.closing-names{font-family:var(--font-display);font-style:italic;font-size:32px;line-height:1.3;margin-top:8px}
.closing-sign{margin-top:26px;color:var(--ink-soft)}
.foot{padding:28px 24px 0;text-align:center;font-size:15px;color:var(--ink-soft)}

/* ===== 11-12. NAVIGASI MELAYANG, TOMBOL MUSIK, TOAST ===== */
.overlay{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.overlay-in{position:relative;width:100%;max-width:var(--col);height:100%;visibility:hidden}
body.opened .overlay-in{visibility:visible}
.overlay-in > *{pointer-events:auto}
.bnav{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;padding:5px;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 30px rgba(42,45,42,.13);opacity:0;transform:translateY(130%)}
@media (prefers-reduced-motion:no-preference){.bnav{transition:opacity .6s .5s,transform .8s .5s cubic-bezier(.2,.7,.2,1)}}
body.opened .bnav{opacity:1;transform:none}
.bnav a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:17px;color:var(--ink-soft);text-decoration:none;font-size:10.5px;font-weight:500;line-height:1.1}
.bnav a svg{width:20px;height:20px}
.bnav a.active{background:var(--sage-pale);color:var(--sage-deep)}
.fab{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.93);color:var(--sage-deep);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(42,45,42,.12)}
.fab svg{width:22px;height:22px}
.fab.playing::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--sage);opacity:0}
@media (prefers-reduced-motion:no-preference){.fab.playing::after{animation:ping 2.4s ease-out infinite}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:12px 22px;border-radius:999px;background:var(--ink);color:#FAF9F6;font-size:15px;text-align:center;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<script>document.documentElement.classList.add('js','locked');</script>
<noscript><p style="padding:24px;text-align:center">Aktifkan JavaScript untuk melihat undangan ini.</p></noscript>

<!-- Ornamen floral tipis (dipakai ulang lewat <use>) -->

<!-- 1. COVER layar penuh -->
<section id="cover" class="cover" aria-label="Sampul undangan">
  <div class="cover-in">
    <div class="cover-photo">
      <span class="cover-mono" id="cover-mono" aria-hidden="true"></span>
      <img data-img="coverPhoto" data-fb="hide" alt="" decoding="async">
    </div>
    <div class="cover-fade"></div>
    <svg class="cover-orn l" viewBox="0 0 160 80" aria-hidden="true"><use href="#orn-sprig"/></svg>
    <svg class="cover-orn r" viewBox="0 0 160 80" aria-hidden="true"><use href="#orn-sprig"/></svg>
    <div class="cover-body">
      <p class="cover-eyebrow" data-t="ui.cover.eyebrow"></p>
      <h1 class="cover-names"><span data-t="bride.nick"></span><span class="amp">&amp;</span><span data-t="groom.nick"></span></h1>
      <p class="cover-date" id="cover-date"></p>
      <div class="guest">
        <p class="guest-label" data-t="ui.cover.guestLabel"></p>
        <p class="guest-name" id="guest-name"></p>
      </div>
      <button class="btn" id="open-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <span data-t="ui.cover.open"></span>
      </button>
    </div>
  </div>
</section>

<div class="app" id="app">
<main>

  <!-- 2. SALAM PEMBUKA + AYAT + SAMBUTAN -->
  <section id="home" class="sec" data-nav="home" aria-labelledby="home-h">
    <svg class="orn reveal" viewBox="0 0 220 28" aria-hidden="true"><use href="#orn-divider"/></svg>
    <p class="eyebrow reveal" data-t="home.bismillah"></p>
    <h2 class="h2 reveal" id="home-h" data-t="home.salam"></h2>
    <p class="lead reveal" data-t="home.intro"></p>
    <figure class="verse reveal">
      <blockquote data-t="home.verse.text"></blockquote>
      <figcaption data-t="home.verse.source"></figcaption>
    </figure>
    <p class="lead reveal" data-t="home.invite"></p>
  </section>

      <img alt="${esc(g.alt)}" loading="lazy" decoding="async">
    </button>`).join('');
  $$('#grid img').forEach((img, i) => setImg(img, DATA.gallery[i].src));

  const G = DATA.gift;
  $('#gifts').innerHTML = G.accounts.map((a, i) => `
    <article class="card reveal" style="--d:${i * 90}ms">
      <p class="acct-type">${esc(a.type)}</p>
      <p class="acct-num">${esc(a.number)}</p>
      <p class="acct-holder">${esc(a.holder)}</p>
      <button class="btn btn--ghost" type="button" data-copy="${esc(a.number)}">${esc(UI.gift.copyAccount)}</button>
    </article>`).join('') + `
    <article class="card reveal">
      <p class="acct-type">${esc(G.address.label)}</p>
      <p class="acct-addr"><strong>${esc(G.address.recipient)}</strong><br>${esc(G.address.text)}</p>
      <button class="btn btn--ghost" type="button" data-copy="${esc(G.address.recipient + ', ' + G.address.text)}">${esc(UI.gift.copyAddress)}</button>
    </article>`;

  $('#bnav').innerHTML = UI.nav.map(n => `<a href="#${n.id}" data-go="${n.id}">${svgIcon(n.icon)}<span>${esc(n.label)}</span></a>`).join('');

  /* ---- Toast & salin ---- */
  const toastEl = $('#toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* lanjut ke cadangan */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    toast((await copyText(b.dataset.copy)) ? UI.gift.copied : UI.gift.copyFail);
  });

  /* ---- Countdown ---- */
  const target = startDate.getTime();
  const pad = n => String(n).padStart(2, '0');
  let timer;
  function tick() {
    const diff = Math.max(0, target - Date.now());
    $('#cd-d').textContent = Math.floor(diff / 864e5);
    $('#cd-h2').textContent = pad(Math.floor(diff % 864e5 / 36e5));
    $('#cd-m').textContent = pad(Math.floor(diff % 36e5 / 6e4));
    $('#cd-s').textContent = pad(Math.floor(diff % 6e4 / 1e3));
    if (diff === 0) { $('#cd').hidden = true; $('#cd-done').hidden = false; clearInterval(timer); }
  }
  tick(); timer = setInterval(tick, 1000);

  /* ---- Musik latar (sembunyikan tombol jika gagal dimuat) ---- */
  const fab = $('#music');
  const audio = new Audio();
  audio.preload = 'none'; audio.loop = true; audio.volume = 0.7; audio.src = DATA.music.url;
  let musicDead = false;
  const killMusic = () => { musicDead = true; fab.hidden = true; };
  const syncFab = () => {
    const on = !audio.paused && !musicDead;
    fab.classList.toggle('playing', on);
    fab.setAttribute('aria-pressed', String(on));
    fab.setAttribute('aria-label', on ? UI.music.off : UI.music.on);
    $('.ic-on', fab).hidden = !on; $('.ic-off', fab).hidden = on;
  };
  audio.addEventListener('error', killMusic);
  audio.addEventListener('play', syncFab);
  audio.addEventListener('pause', syncFab);
  function playMusic() {
    if (musicDead) return;
    try {
      const p = audio.play();
      if (p && p.catch) p.catch(err => { if (!err || (err.name !== 'NotAllowedError' && err.name !== 'AbortError')) killMusic(); syncFab(); });
    } catch (e) { killMusic(); }
    setTimeout(() => { if (!musicDead && audio.readyState === 0 && audio.networkState !== 2) killMusic(); }, 8000);
  }
  fab.addEventListener('click', () => { audio.paused ? playMusic() : audio.pause(); });
  syncFab();

  /* ---- Buka undangan ---- */
  const cover = $('#cover'), app = $('#app'), openBtn = $('#open-btn');
  app.inert = true;
  try { openBtn.focus({ preventScroll: true }); } catch (e) { /* abaikan */ }
  openBtn.addEventListener('click', () => {
    document.documentElement.classList.remove('locked');
    document.body.classList.add('opened');
    app.inert = false;
    cover.classList.add('is-open');
    window.scrollTo(0, 0);
    playMusic();
    setTimeout(() => { cover.hidden = true; }, reduceMotion ? 0 : 1150);
  });

  /* ---- Navigasi: scroll halus + sorot bagian aktif ---- */
  const navLinks = $$('#bnav a');
  const setActive = id => navLinks.forEach(a => {
    const on = a.dataset.go === id;
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
  navLinks.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const sec = document.getElementById(a.dataset.go);
    if (sec) sec.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    setActive(a.dataset.go);
  }));
  setActive('home');

  /* ---- Lightbox galeri ---- */
  const lb = $('#lb'), lbImg = $('#lb-img'), lbCount = $('#lb-count');
  let lbIndex = 0, lbOpener = null, touchX = null;
  lbImg.addEventListener('error', () => { if (!lbImg.dataset.done) { lbImg.dataset.done = '1'; lbImg.src = PH; } });
  function lbShow(i) {
    const n = DATA.gallery.length;
    lbIndex = (i + n) % n;
    lbImg.dataset.done = '';
    lbImg.alt = DATA.gallery[lbIndex].alt;
    lbImg.src = DATA.gallery[lbIndex].src;
    lbCount.textContent = `${lbIndex + 1} / ${n}`;
  }
  function lbOpen(i, opener) {
    lbOpener = opener; lbShow(i);
    lb.hidden = false;
    document.documentElement.classList.add('locked');
    $('#lb-close').focus();
  }
  function lbClose() {
    lb.hidden = true;
    document.documentElement.classList.remove('locked');
    if (lbOpener) lbOpener.focus();
  }
  $('#grid').addEventListener('click', e => {
    const b = e.target.closest('.shot');
    if (b) lbOpen(Number(b.dataset.i), b);
  });
  $('#lb-close').addEventListener('click', lbClose);
  $('#lb-prev').addEventListener('click', () => lbShow(lbIndex - 1));
  $('#lb-next').addEventListener('click', () => lbShow(lbIndex + 1));
  lb.addEventListener('click', e => { if (e.target === lb) lbClose(); });
  lb.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 50) lbShow(lbIndex + (dx < 0 ? 1 : -1));
  });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowLeft') lbShow(lbIndex - 1);
    else if (e.key === 'ArrowRight') lbShow(lbIndex + 1);
  });

  /* ---- RSVP + ucapan (localStorage dengan try/catch) ---- */
  const R = UI.rsvp;
  const KEY = 'ahira:wishes:' + DATA.meta.storageKey;
  const store = {
    read() { try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } },
    write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* tetap jalan di memori */ } }
  };
  let wishes = store.read();
  const dateFmt = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Jakarta' });

  const guestsSel = $('#f-guests'), nameInp = $('#f-name'), msgInp = $('#f-msg');
  guestsSel.innerHTML = Array.from({ length: R.maxGuests }, (_, i) => `<option value="${i + 1}">${i + 1} ${esc(R.guestsUnit)}</option>`).join('');
  if (guest !== DATA.guest.default) nameInp.value = guest;
  $$('input[name="att"]').forEach(r => r.addEventListener('change', () => { guestsSel.disabled = r.value === 'no' && r.checked; }));

  function renderWishes() {
    const all = wishes.concat(DATA.samples.map(s => Object.assign({ sample: true }, s)));
    const ul = $('#wishes');
    if (!all.length) { ul.innerHTML = `<li class="wish">${esc(R.empty)}</li>`; return; }
    ul.innerHTML = all.map(w => {
      const att = w.att === 'yes' ? `<span class="pill">${esc(R.yes)} · ${Number(w.guests) || 1} ${esc(R.guestsUnit)}</span>` : `<span class="pill pill--no">${esc(R.no)}</span>`;
      const tag = w.sample ? `<span class="pill pill--tag">${esc(R.sampleTag)}</span>` : '';
      const time = w.ts ? `<time class="wish-time">${esc(dateFmt.format(new Date(w.ts)))}</time>` : '';
      return `<li class="wish"><div class="wish-top"><span class="wish-name">${esc(w.name)}</span>${att}${tag}</div><p class="wish-msg">${esc(w.msg)}</p>${time}</li>`;
    }).join('');
  }
  renderWishes();

  $('#rsvp-form').addEventListener('submit', e => {
    e.preventDefault();
    const name = nameInp.value.trim(), msg = msgInp.value.trim();
    const checked = $('input[name="att"]:checked');
    if (!name || !msg || !checked) { toast(R.invalid); return; }
    const att = checked.value;
    wishes.unshift({ name, att, guests: att === 'yes' ? Number(guestsSel.value) : 0, msg, ts: Date.now() });
    wishes = wishes.slice(0, 100);
    store.write(wishes);
    renderWishes();
    $('#wishes').scrollTop = 0;
    msgInp.value = '';
    toast(R.saved);
  });

  /* ---- Fade-in saat masuk viewport + sorot nav berdasarkan posisi scroll ---- */
  const reveals = $$('.reveal');
  if ('IntersectionObserver' in window) {
    const ro = new IntersectionObserver((entries, o) => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); o.unobserve(en.target); }
    }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    reveals.forEach(el => ro.observe(el));
    const no = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) setActive(en.target.dataset.nav);
    }), { rootMargin: '-45% 0px -50% 0px' });
    $$('[data-nav]').forEach(s => no.observe(s));
  } else {
    reveals.forEach(el => el.classList.add('in'));
  }
})();
</script>

</html>
